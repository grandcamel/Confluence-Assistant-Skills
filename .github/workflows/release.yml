name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: simple
          token: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # confluence-as 2.0.0 final is not on PyPI yet -- only the
          # 2.0.0rc1 pre-release is, so --pre is required until it ships.
          pip install --pre "confluence-as>=2,<3" pytest pytest-asyncio pytest-cov pyyaml
          pip install --no-deps -e .

      - name: Run unit tests
        run: |
          python -m pytest -q --deselect skills/confluence/tests/test_routing.py --deselect tests/e2e/test_plugin_e2e.py

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check . --output-format=github || true

  publish-release:
    needs: [release-please, test]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release archive
        run: |
          VERSION=${{ needs.release-please.outputs.version }}
          mkdir -p dist
          tar -czvf dist/confluence-assistant-skills-${VERSION}.tar.gz \
            --exclude='*/tests/*' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            .claude-plugin/ \
            README.md \
            VERSION

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ needs.release-please.outputs.version }}
          gh release upload v${VERSION} dist/confluence-assistant-skills-${VERSION}.tar.gz --clobber
