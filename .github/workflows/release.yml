name: Release

# Landing never starts release-please or publishes. Dispatch the reviewed SHA only.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full reviewed main commit SHA
        required: true
        type: string
      publish:
        description: Create the reviewed v3.0.0 release after acceptance
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: plugin-release
  cancel-in-progress: false

env:
  CORE_WHEEL: "https://files.pythonhosted.org/packages/9c/ed/544ab9a6038e66dfea45cd6db097d05afc82f879fbdf28835e8de310e238/as_engine-0.1.2-py3-none-any.whl#sha256=ac4cb0b07effbecff812652a33aea54b036971e883d3fe349428c6d723d90d83"
  CLI_WHEEL_URL: ${{ vars.CONFLUENCE_CLI_WHEEL_URL }}
  CLI_WHEEL_SHA256: ${{ vars.CONFLUENCE_CLI_WHEEL_SHA256 }}
  E2E_SUFFICIENCY: "0"
  PYTEST_ADDOPTS: ""

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate reviewed source identity
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pytest-cov pyyaml ruff
          python tests/release_checks.py fetch-wheel .artifacts
          pip install "$CORE_WHEEL" .artifacts/*.whl
          python tests/release_checks.py verify-core
          pip install --no-deps -e .
          pip check

      - name: Collect paid modules without launching
        run: python -m pytest --collect-only -q skills/confluence/tests/test_routing.py tests/e2e/test_plugin_e2e.py

      - name: Run complete offline suite
        run: python -m pytest -q --deselect skills/confluence/tests/test_routing.py --deselect tests/e2e/test_plugin_e2e.py

      - name: Lint and format
        run: |
          ruff check . --output-format=github
          ruff format --check .

      - name: Create inspected release archive
        run: python tests/release_checks.py archive dist/confluence-assistant-skills-3.0.0.tar.gz

      - name: Preserve validated archive
        uses: actions/upload-artifact@v4
        with:
          name: plugin-release-archive
          path: dist/confluence-assistant-skills-3.0.0.tar.gz
          if-no-files-found: error

  publish-release:
    needs: test
    if: github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-latest
    environment: plugin-release
    permissions:
      contents: write
    steps:
      - name: Retrieve validated archive
        uses: actions/download-artifact@v4
        with:
          name: plugin-release-archive
          path: dist

      - name: Create release once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          # Atomic ref creation refuses existing tags and every API failure.
          # A failed release upload retains the tag for manual reconciliation.
          gh api "repos/$GH_REPO/git/refs" \
            -f ref=refs/tags/v3.0.0 -f sha="$EXPECTED_SHA"
          gh release create v3.0.0 dist/confluence-assistant-skills-3.0.0.tar.gz \
            --repo "$GH_REPO" --verify-tag \
            --title "3.0.0" --notes "Reviewed one-skill plugin release."
