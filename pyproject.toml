[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confluence-assistant-skills-plugin"
version = "3.0.0"
description = "One Confluence skill: the Entry-Point Hint for the confluence-as CLI 2.x. Run confluence-as help first."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Jason Krueger"}
]
keywords = ["confluence", "atlassian", "cli", "assistant", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "confluence-as>=2,<3",
]

[tool.setuptools]
packages = []  # No Python packages - this is a Claude Code plugin

[project.optional-dependencies]
dev = [
    "pre-commit>=3.5.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/grandcamel/Confluence-Assistant-Skills"
Documentation = "https://github.com/grandcamel/Confluence-Assistant-Skills#readme"
Repository = "https://github.com/grandcamel/Confluence-Assistant-Skills"
Issues = "https://github.com/grandcamel/Confluence-Assistant-Skills/issues"

# =============================================================================
# Ruff - Fast Python linter and formatter (replaces flake8, isort, black)
# =============================================================================
[tool.ruff]
target-version = "py310"
line-length = 88
# ruff >=0.16 format-checks Python code blocks inside Markdown; keep the gate
# scoped to real Python files (CI and release validation pin ruff 0.16.10).
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function calls in argument defaults (Click uses this)
    "B904",   # Within an except clause, raise from err or None
    "ARG001", # Unused function argument (common in CLI apps)
    "ARG002", # Unused method argument
    "SIM108", # Use ternary operator (readability preference)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["ARG", "S101", "PLR2004"]  # Allow asserts and magic values in tests
"**/conftest.py" = ["ARG"]
# Required byte-identical to the sibling jira plugin's copy; ignored
# here rather than "fixed", which would break that identity.
"tests/stream_observe.py" = ["UP035"]

[tool.ruff.lint.isort]
known-first-party = ["confluence_as"]
force-single-line = false
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

# =============================================================================
# Mypy - Static type checking
# =============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = false  # Gradual adoption - enable later
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "tabulate.*",
    "colorama.*",
    "tqdm.*",
    "responses.*",
    "confluence_as.*",
]
ignore_missing_imports = true

# =============================================================================
# Bandit - Security scanning
# =============================================================================
[tool.bandit]
exclude_dirs = ["tests", "**/tests", "conftest.py"]
skips = [
    "B101",  # assert_used - OK in production for invariants
    "B104",  # hardcoded_bind_all_interfaces - not applicable
]

# =============================================================================
# Pytest configuration lives in pytest.ini (pytest's own config-file
# precedence order reads it ahead of this [tool.pytest.ini_options]
# table when both exist, so a duplicate here would be dead and easy to
# let drift -- removed rather than kept in sync with two copies).
# =============================================================================

[tool.coverage.run]
source = ["skills"]
omit = ["*/tests/*", "*/conftest.py", "*/__init__.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
