# Help-only sufficiency arm: seven representative confluence-as tasks.
#
# The model gets nothing but skills/confluence/SKILL.md (the Entry-Point
# Hint), the Bash and Skill tools, and a `confluence-as` on PATH running
# in `simulation` transport with CONFLUENCE_ALLOWED_SPACES=DOCS and no
# credentials. runner.py appends a fixed trailer to each prompt below
# (see PROMPT_TRAILER) telling the model to act now, not ask a question,
# and use space DOCS / page 1 -- the simulation transport's default
# seed's own space and page id.
#
# `accept` lists what counts as a matching confluence-as invocation for
# the task (see runner.py's command_matches_accept): a bare operationId
# matches `api call OPERATIONID` only (an `api describe` of the same
# operation is a discovery step, not the action performed);
# "describe:OPERATIONID" matches only `api describe OPERATIONID`. No task
# below uses a "verb pair" entry: confluence-as has no Compatibility
# Contract of survivor verbs the way jira-as does (every `confluence-as
# GROUP VERB` invocation is a migration-hint stub that exits 2), so there
# is nothing for that shape to match here.
#
# Every accept entry below was verified against the scratch confluence-as
# 2.0.0rc1 binary before this file was frozen. Two of the seven initially
# sketched tasks (add a label or comment to page 1; update page 1's
# title) were substituted for a functionally equivalent operation after
# verification showed the originally-sketched operation cannot succeed
# under this harness's simulation transport at all -- a transport
# limitation, not a hint-sufficiency question:
#   - createFooterComment, createInlineComment, getPageFooterComments and
#     getPageInlineComments all exit 6, "simulation does not support
#     operation: <name>"; `api search label` lists no write (POST)
#     endpoint for labels at all in this CLI version.
#   - updatePageTitle also exits 6 the same way ("simulation does not
#     support operation: updatePageTitle").
# Both substitutes below (createPageProperty, updatePagePropertyById) are
# genuinely functional, page-1-scoped write operations verified end to
# end against the scratch binary, including updatePagePropertyById's
# not-found response against a property that does not exist by default
# (exit 5, `{"status": 404, "messages": ["Property not found"]}` -- no
# "Unknown operation" message, so runner.classify_replay's fallback rule
# for this shape classifies it well-formed, the same way a genuine
# not-found is treated everywhere else in this harness).
metadata:
  name: confluence-sufficiency-arm
  description: Help-only sufficiency arm for the confluence skill
  version: 3.0.0

tasks:
  - id: read-page
    prompt: Read the details of Confluence page 1 in space DOCS.
    accept:
      - getPageById
  - id: search-cql
    prompt: Search Confluence for content of type page.
    accept:
      - searchByCQL
  - id: create-page-property
    prompt: >-
      Create a property named 'harness-probe' with the value 'confirmed'
      on Confluence page 1 in space DOCS.
    accept:
      - createPageProperty
  - id: read-page-labels
    prompt: Find out whether Confluence page 1 in space DOCS has any labels.
    accept:
      - getPageLabels
  - id: update-page-property
    prompt: >-
      Update the property with id 1 on Confluence page 1 in space DOCS
      to the value 'updated'; a not-found response is fine.
    accept:
      - updatePagePropertyById
  - id: delete-page
    prompt: >-
      Delete Confluence page 2 in space DOCS; a preview of the request is
      enough, do not confirm it.
    accept:
      - deletePage
  - id: find-attachments-operation
    prompt: >-
      Find and describe the confluence-as API operation that lists a
      page's attachments.
    accept:
      - "describe:getPageAttachments"
