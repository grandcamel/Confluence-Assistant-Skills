[pytest]
# Test discovery paths - include both e2e tests and skill tests
testpaths = tests skills

# Directories to ignore during test collection
norecursedirs =
    __pycache__
    .git
    .venv
    node_modules

# Test file patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Import mode - use importlib to avoid conflicts with multiple tests/ directories
pythonpath = .
addopts = -v --tb=short --import-mode=importlib

# Filter warnings
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Markers actually used by this plugin's offline suite and its two
# host-triggered live harnesses.
markers =
    e2e: The help-only sufficiency arm (requires the real Claude Code CLI)
    live: The two-skill routing check (requires the real Claude Code CLI)
    slow: Tests that may take a long time to complete (the two live harnesses)
